name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest --cov=chatbot_eval --cov-report=term-missing
      - name: Example evaluation (offline)
        run: >
          chatbot-eval run examples/cases/triage_nl.yaml
          --bot examples.bots:rule_based_bot --judge keyword
          --markdown /dev/null --json report.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: eval-report
          path: report.json
